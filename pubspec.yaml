  shared_preferences: ^2.3.1
  smooth_page_indicator: ^1.2.0+3
  store_redirect: ^2.0.1
  story_view: ^0.16.5
  swipe_to: ^1.0.6
  syncfusion_flutter_gauges: ^24.2.9
  syncfusion_flutter_pdfviewer: ^24.1.41
  # timelines: ^0.1.0
